name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android/app/release.keystore
          key: babes-release-keystore-v1

      - name: Create release keystore
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias babesnotebook \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "BabesNotebook2026" \
            -keypass "BabesNotebook2026" \
            -dname "CN=Babes Notebook, OU=Personal, O=Kidus, L=Addis Ababa, ST=Addis Ababa, C=ET"

      - name: Write signing config
        run: |
          cat > android/key.properties <<'EOF'
          storePassword=BabesNotebook2026
          keyPassword=BabesNotebook2026
          keyAlias=babesnotebook
          storeFile=release.keystore
          EOF

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 APK (Samsung A31)
        run: |
          pip install pillow
          python3 tool/generate_app_icon.py
          flutter pub run flutter_launcher_icons
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=PERSONAL_MODE=true

      - name: Rename APK for easy install
        run: |
          cd build/app/outputs/flutter-apk
          cp app-release.apk Babes-Notebook-arm64.apk
          ls -la Babes-Notebook-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/Babes-Notebook-arm64.apk
