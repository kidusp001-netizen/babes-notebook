<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Babe's Notebook — daily letters to God">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Babe's Notebook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.js" as="script">
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" crossorigin>
  <link rel="preload" href="images/queen_avatar.png" as="image">

  <title>Babe's Notebook</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff5f7;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4a1942;
      text-align: center;
      gap: 16px;
    }

    /* Creative curved rectangle frame for her photo */
    .portrait-frame {
      position: relative;
      width: 112px;
      height: 136px;
      border-radius: 28px;
      padding: 4px;
      background: linear-gradient(145deg, #e8b4bc, #ec4899, #db2777);
      box-shadow: 0 16px 32px rgba(236, 72, 153, 0.35);
    }

    .portrait-frame::before {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 32px;
      border: 2px solid rgba(236, 72, 153, 0.25);
      pointer-events: none;
    }

    .portrait-frame img {
      width: 100%;
      height: 100%;
      border-radius: 24px;
      object-fit: cover;
      border: 3px solid white;
      display: block;
    }

    .portrait-frame .heart {
      position: absolute;
      bottom: -6px;
      right: -6px;
      width: 28px;
      height: 28px;
      background: #ec4899;
      border-radius: 50%;
      border: 2px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      box-shadow: 0 4px 10px rgba(236, 72, 153, 0.4);
    }

    #loading h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    #loading p {
      margin: 0;
      color: #a67b8a;
      font-size: 14px;
    }

    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #fbcfe8;
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="portrait-frame">
      <img src="images/queen_avatar.png" alt="Babe">
      <div class="heart">♡</div>
    </div>
    <h1>Babe's Notebook</h1>
    <p>Loading your journal…</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
