<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Babe's Notebook — daily letters to God">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Babe's Notebook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Babe's Notebook</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #fff5f7;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #4a1942;
      text-align: center;
      gap: 16px;
    }

    #loading .logo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8b4bc, #ec4899, #db2777);
      padding: 4px;
      box-shadow: 0 12px 24px rgba(236, 72, 153, 0.35);
    }

    #loading .logo img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid white;
    }

    #loading h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    #loading p {
      margin: 0;
      color: #a67b8a;
      font-size: 14px;
    }

    #loading .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #fbcfe8;
      border-top-color: #ec4899;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">
      <img src="icons/Icon-192.png" alt="Babe's Notebook">
    </div>
    <h1>Babe's Notebook</h1>
    <p>Loading your journal…</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
